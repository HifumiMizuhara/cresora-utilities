plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.2.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
		repositories {
			maven {
				name = "Wisp Forest"
				url = "https://maven.wispforest.io/releases"
		}
		maven {
			name = "Ladysnake Mods"
			url = "https://maven.ladysnake.org/releases"
			}
			maven { url = "https://maven.shedaniel.me/" }
			maven { url = "https://maven.fabricmc.net/" }
			exclusiveContent {
				forRepository {
					maven {
						name = "Modrinth"
						url = "https://api.modrinth.com/maven"
					}
				}
				filter {
					includeGroup "maven.modrinth"
				}
			}
		}
	}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cresora-utilities" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration() {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
	modImplementation "maven.modrinth:trinkets-canary:${project.trinkets_version}"
	implementation "com.squareup:kotlinpoet:1.16.0"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	if (name == "compileJava" || name == "compileClientJava") {
		if (it.classpath != null) {
			it.classpath += files(new File(project.buildDir, "classes/kotlin/main"))
			it.classpath += files(new File(project.buildDir, "classes/kotlin/client"))
		} else {
			it.classpath = files(new File(project.buildDir, "classes/kotlin/main"), new File(project.buildDir, "classes/kotlin/client"))
		}
	}
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 21
	}
}

sourceSets {
	compiler {
		kotlin.srcDirs = ['src/compiler/kotlin']
	}
	compilerTest {
		kotlin.srcDirs = ['src/compilerTest/kotlin']
		resources.srcDirs = ['src/compilerTest/resources']
		compileClasspath += sourceSets.compiler.output
		runtimeClasspath += sourceSets.compiler.output
	}
}

configurations {
	compilerTestImplementation.extendsFrom compilerImplementation
}

dependencies {
	compilerImplementation "com.squareup:kotlinpoet:1.16.0"
	compilerImplementation "com.google.code.gson:gson:2.11.0"
	compilerImplementation "org.jetbrains.kotlin:kotlin-stdlib"
	compilerTestImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	compilerTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register('compilerTest', Test) {
	group = "cresora"
	description = "Unit tests for the CWC/CAC compilers"
	testClassesDirs = sourceSets.compilerTest.output.classesDirs
	classpath = sourceSets.compilerTest.runtimeClasspath
	useJUnitPlatform()
}
tasks.register('combatBalanceReport', JavaExec) {
	group = "cresora"
	description = "Reports deterministic combat balance checkpoints"
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "hifumi.cresora.combat.CombatBalanceReportMain"
}
tasks.named('check') { dependsOn 'compilerTest' }

tasks.named('test') {
	useJUnitPlatform()
}

task compileAssets(type: JavaExec) {
    group = "cresora"
    description = "Compiles .cresora, .artifact, and .movement DSL files to Kotlin code and JSON"
    mainClass = "hifumi.cresora.compiler.MainKt"
    classpath = sourceSets.compiler.runtimeClasspath

    // Inputs: DSL source files, immutable resource bases, and the compiler itself
    inputs.dir("src/main/cresora")
    inputs.dir("src/main/resources")
    inputs.files(sourceSets.compiler.output)

    // Generated outputs
    def kotlinOutDir = layout.buildDirectory.dir("generated/cresora/kotlin")
    def resourceOutDir = layout.buildDirectory.dir("generated/cresora/resources")
    outputs.dir(kotlinOutDir)
    outputs.dir(resourceOutDir)

    jvmArgs = [
        "-Dcresora.output.kotlin=${kotlinOutDir.get().asFile.absolutePath}",
        "-Dcresora.output.resources=${resourceOutDir.get().asFile.absolutePath}",
        "-Dcresora.source.resources=${file('src/main/resources').absolutePath}"
    ]

    standardOutput = System.out
    errorOutput = System.err
}

def cresoraGeneratedResourceDir = layout.buildDirectory.dir("generated/cresora/resources")

// Wire generated sources into the main source set
sourceSets.main {
    kotlin.srcDir(layout.buildDirectory.dir("generated/cresora/kotlin"))
    // processResources below explicitly assembles the immutable base and generated overlay.
    // Leaving the default source roots here would copy stale checked-in generated assets too.
    resources.setSrcDirs([])
}

// The DSL compilers copy and augment these asset trees under build/generated. Excluding
// their source counterparts prevents Gradle from selecting stale checked-in files.
processResources {
    from("src/main/resources") {
        exclude "assets/cresora-utilities/lang/**"
        exclude "assets/cresora-utilities/items/**"
        exclude "assets/cresora-utilities/models/item/**"
        exclude "data/cresora-utilities/cresora/cwc_weapon_content.json"
        exclude "data/cresora-utilities/cresora/cac_artifact_content.json"
        exclude "data/cresora-utilities/cresora/story_content.json"
        exclude "data/cresora-utilities/cresora/story_texts.json"
    }
    from(cresoraGeneratedResourceDir)
}

compileKotlin.dependsOn compileAssets
processResources.dependsOn compileAssets
tasks.matching { it.name == "sourcesJar" }.configureEach { it.dependsOn compileAssets }

task generateWeapons {
    dependsOn compileAssets
    doLast {
        logger.warn("Task 'generateWeapons' is deprecated. Please use 'compileAssets' instead.")
    }
}


tasks.named("runServer") {
	standardInput = System.in
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
